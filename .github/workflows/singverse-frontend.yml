name: singverse-frontend
on:
  release:
    types: [published]
permissions:
  contents: write
env:
  RELEASE_TAG: ${{ github.event.release.tag_name }}
concurrency:
  group: frontend-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  release:
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set version from Release tag
        run: python3 scripts/build_version.py --github-env
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build frontend
        run: |
          npm ci --no-audit --no-fund
          npm exec -- vite build
      - name: Package release
        run: python3 scripts/package-release.py
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/upload-release.py
